# Telegram Bot Token（从 @BotFather 获取，记得在 BotFather 中 /setprivacy -> Disable）
bot_token: "YOUR_TELEGRAM_BOT_TOKEN"

# 管理员个人 Telegram 数字 ID 列表（必填，用于权限豁免、接收审计日志、点击“一键解封”按钮）
# 可通过给 @userinfobot 发消息获取你的数字 ID
admin_ids:
  - 123456789

# 审计日志接收目标 ID（可选：填专用私有日志群/频道的 -100xxxx ID；若留 0 则默认私聊发给第一个 admin_ids）
log_chat_id: 0

# 允许保护的评论区群聊 ID 白名单（可选：留空 [] 表示保护 Bot 所在的所有群组；也可指定具体的 -100xxxx 群 ID）
allowed_chat_ids: []

# 群组与群主/管理员的多对多绑定（可选：支持 1 群绑多管理员、多群绑 1 群主）
# 未单独绑定的群自动回退推送到 log_chat_id；也可直接私聊 Bot 用 /bind 和 /unbind 动态管理
# chat_admins:
#   -1003514831848: [123456789]
#   -1002626586289: [123456789, 987654321]

# 推送卡片中的疑似 Spam 内容与昵称默认是否开启 Spoiler 遮罩（默认 true，每位管理员也可在 /panel 面板中单独切换）
spoiler_default: true

# 嵌入式 BoltDB 数据库存储路径（自动创建目录）
db_path: "data/antispam.db"

# 群内老成员豁免天数：加入群满 N 天以上的群成员（以及上线前已在群内的存量老群友）不受正则误伤
# 注：未加群的纯评论区路人永远不享受豁免
veteran_days: 7

# 命中规则后的高压警戒窗口秒数（默认 60 秒）
alert_window_seconds: 60

# 警戒窗口期内，是否拦截一切非老群友通过 Inline Bot (via @xxxbot) 发出的消息
ban_any_inline_in_alert: true

# 是否将捕获到的恶意 @xxxbot 永久记入本地黑名单并持续拦截其后续引流/Inline 调用
block_known_bad_bots: true

# 反 Spam 正则规则列表（单条规则内的 all_of 所有正则同时命中即触发三件套）
# 字段说明：
#   target:  检测目标，"message"(默认，仅正文/配文) | "name"(仅昵称/马甲频道名) | "any"(正文或昵称任一命中) | "combined"(昵称+正文拼接)
#   compact: 设为 true 时，自动去除空格与标点拆字干扰、折叠繁简异体字及康熙部首后再匹配（保留 ⬅/←/👈/🔞 等符号锚点）
# 采用 Go RE2 正则语法，支持 \x{XXXX} Unicode 码点转义
rules:
  - name: "start_with_bot_mention"
    target: "message"
    all_of:
      - '(?i)(?:^|[\s"''(\[>])/start(?:\b|@)'
      - '(?i)@[a-z0-9_]{2,}bot\b'

  - name: "bot_campaign_spam"
    target: "message"
    all_of:
      - '(?i)@[a-z0-9_]{2,}bot\b'
      - '(?i)(?:\bcampaign[_-]?\d+|\b[a-z]?[0-9a-f]{16,}\b)'

  - name: "arrow_bio_bait"
    target: "message"
    compact: true
    all_of:
      - '^(?:\x{2b05}|\x{2190}|\x{1f448})+(?:\x{597d}\x{770b}|\x{70b9}\x{6211}|\x{770b}\x{7b80}\x{4ecb}|\x{8fdb}\x{7b80}\x{4ecb}|\x{70b9}\x{5934}\x{50cf}|\x{770b}\x{4e3b}\x{9875})'

  - name: "bio_redirect_spam"
    target: "any"
    compact: true
    all_of:
      - '(?:\x{8fdb}\x{7b80}\x{4ecb}\x{770b}|\x{6bcf}\x{5929}\x{66f4}\x{65b0}\x{8fdb}\x{7b80}\x{4ecb})'

  - name: "rare_homoglyph_spam"
    target: "any"
    compact: true
    all_of:
      - '(?:[\x{3400}-\x{4dbf}]\x{5973}|\x{5466}\x{9495}|\x{5e7c}\x{9495}|\x{5466}\x{5973})'

  - name: "obfuscated_illegal_ad"
    target: "any"
    compact: true
    all_of:
      - '(?:\x{9b3c}\x{7236}|\x{5341}\x{5c81}\x{5973}\x{513f}|\x{5c0f}\x{4f84}\x{5973}|\x{5904}\x{5973}\x{819c}|\x{79c1}\x{5bc6}\x{89c6}\x{9891}|\x{88ab}\x{4fb5}\x{72af}\x{89c6}\x{9891}|\x{6697}\x{7f51}.{0,12}\x{89c6}\x{9891}|\x{5c0f}\x{5b66}\x{751f}.{0,8}\x{89c6}\x{9891})'
